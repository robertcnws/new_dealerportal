<!DOCTYPE html>
<html>
  <head>
    <title>Reset password</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
      body,
      table,
      td,
      a {
        font-family: 'Open Sans', sans-serif;
        color: #333333;
      }
      
      body {
        background-color: #f8f8f8;
      }
      
      a {
        color: #669a41;
        text-decoration: none;
      }
      
      p {
        font-size: 14px;
        line-height: 1.5;
      }
      
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        color: #333333;
        line-height: 1.2;
      }
      
      .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }
      
      .header,
      .footer {
        background-color: #ffffff;
      }
      
      .header {
        padding: 20px;
        text-align: center;
      }
      
      .footer {
        padding: 20px;
        text-align: center;
        font-size: 12px;
      }
      
      .content {
        background-color: #ffffff;
        padding: 20px;
      }
      
      .button {
        display: inline-block;
        padding: 15px 25px;
        background-color: #669a41;
        color: #ffffff;
        border-radius: 5px;
        text-align: center;
      }
      
      .button:hover {
        background-color: #567a33;
      }
    </style>
  </head>
  <body style="font-family: 'Open Sans', sans-serif; color: #333333; background-color: #f8f8f8">
    <div style="max-width: 500px; margin: 0 auto; padding: 10px">
      <div style="background-color: #669a41; color: #ffffff; text-align: center; padding: 10px">
        <h5 style="color: #ffffff; line-height: 1.2">Reset your password</h5>
      </div>
      <div style="background-color: #ffffff; color: #333333; padding: 20px">
      <form method="post" action="{% url 'password_reset' %}" class="form-inline">
      {% csrf_token %}
          <div class="form-group">
              <label for="email" class="mb-2">Email</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="Please type your email address" required>
          </div>
        {% comment %} <form method="post"> {% endcomment %}
          {% comment %} {% csrf_token %} {% endcomment %}
          {% comment %} {{ form.as_p }} {% endcomment %}
            <div align="center">
              <button type="submit" style="
                display: inline-block;
                background-color: #669a41;
                color: #ffffff;
                padding: 15px 25px;
                text-decoration: none;
                text-align: center;
                border-radius: 5px;
                cursor: pointer;
              ">Submit</button>
              <a href="{% url 'base-login' %}" style="
                display: inline-block;
                background-color: #6c757d;
                color: #ffffff;
                padding: 15px 25px;
                text-decoration: none;
                text-align: center;
                border-radius: 5px;
                cursor: pointer;
                font-size: 14px;
              ">Login</a>
            </div>
        </form>
      </div>
    </div>
  </body>
</html>
