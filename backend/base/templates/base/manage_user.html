{% extends 'main.html' %} {% block content %}
<h1>Update {{manage_user}} account details</h1>
<hr />
<br />
<div class="create-user-container">
  <form class="create-user-form" method="POST" action="">
    {% csrf_token %}
    <table class="create-user-table">
      {{ form.as_table|safe }}
    </table>
    <input class="create-user-submit" type="submit" value="Update Account" />
  </form>
</div>

{% endblock %}
