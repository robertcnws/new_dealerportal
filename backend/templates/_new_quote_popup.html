<div class="modal fade" id="addNewQuote" tabindex="-1" aria-labelledby="tableRowPopUpsLabel" aria-hidden="true">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content addNewQuote">
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="bi bi-plus-circle me-2"></i>
          New Quote
        </h5>
      </div>
      <div class="modal-body">
    <form method="POST" action="{% url 'base-create-quote' %}">
    
        {% csrf_token %}
        
        <div class="inputDiv">
            <label for="{{ form.name.auto_id }}">Name:</label>
            <input type="text" id="{{ form.name.auto_id }}" name="{{ form.name.html_name }}" value="{{ form.name.value|default:'' }}" required placeholder="Enter Job Name" />
        </div>
        <div class="inputDiv">
            <label for="{{ form.markup.auto_id }}">Markup:</label>
            <input type="number" id="{{ form.markup.auto_id }}" name="{{ form.markup.html_name }}" value="{{ form.markup.value|default:'' }}" required placeholder="Enter MarkUp as %"/>
        </div>

        <!-- Render any other form fields in a similar manner -->

        <div class="btnGroup">
            <input class="btn btn-success" type="submit" value="Create">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
    </form>
</div>

    </div>
  </div>
</div>
