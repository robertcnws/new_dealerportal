{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="icon" type="image/x-icon" href="https://nws-dealer-portal.s3.amazonaws.com/images/favicon.ico"/>
    <title>New Window System Dealer Portal</title>
  
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous"> -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Open Sans', sans-serif;
        }

        .containerMain {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: yellow;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url("{% static 'styles/img/loginBg.jpg' %}") no-repeat center center fixed;
            -webkit-background-size: cover;
            -moz-background-size: cover;
            -o-background-size: cover;
            background-size: cover;

            overflow: hidden;
        }
        
     

        .container {
            max-width: 300px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container img {
            width: 200px;
            height: auto;
        }

        .container h4 {
            letter-spacing: 1px;
            font-weight: bold;
            margin-top: 15px;
        }

        .container p {
            padding: 5px;
            font-size: 12px;
            margin-top: 2px;
            margin-bottom: 4px;
            color: grey;
        }
        .container ul {
            padding: 10px;
            list-style-type: none;
        }
        
        .container ul li {
            font-size: 12px;
            margin-top: 1px;
            margin-bottom: 1px;
            color: grey;
        }


        .container .inputMain form {
            display: flex;
            flex-direction: column;
        }

        .inputGroup {
            display: flex;
            flex-direction: column;
        }

        .inputGroup label {
            font-size: 14px;
            margin-top: 6px;
        }

        .inputGroup input {
            width: 260px;
            height: 30px;
            padding: 0 5px;
            border: 1px solid rgba(173, 170, 170, 0.595);
            border-radius: 5px;
            margin: 5px 0;
        }

       

        .inputGroup input[type="email"]:focus,
        .inputGroup input[type="password"]:focus {
            outline: 0;
        }

        .forgetLink {
            display: inline-block;
            width: max-content;
            margin-left: auto;
            margin-top: 0;
            font-size: 12px;
            color: #669A41;
            text-align: right;
            cursor: pointer;
        }

        .submitBtn {
            background: #669A41;
            color: white;
            width: 100%;
            border: none;
            font-size: 16px;
            border-radius: 5px;
            margin-top: 18px;
            padding: 8px 0;
            outline: 0;
            cursor: pointer;
        }

        .showHideBtn {
            background: none;
            border: none;
            width: 10px;
            height: 10px;
            position: absolute;
            margin-top: 35px;
            margin-left: 244px;
        }

        @media (max-width: 768px) {
            .container {
                max-width: 250px;
                padding: 15px;
            }
            .container img {
                width: 150px;
                height: auto;
            }
    
            .container h4 {
                letter-spacing: 0;
                font-weight: 600;
                margin-top: 5px;
            }
    
            .container p {
                padding: 5px;
                font-size: 10px;
                margin-top: 0;
                margin-bottom: 0;
            }
            .inputGroup label {
                font-size: 11px;
                margin-top: 3px;
            }
    
            .inputGroup input {
                width: 230px;
                height: 25px;
                border-radius: 3px;
            }
            .inputGroup input::placeholder{
                font-size: 10px;
            }
            .forgetLink{
                font-size: 11px;
            }
            .submitBtn {
                width: 100%;
                font-size: 14px;
                border-radius: 3px;
                margin-top: 10px;
                padding: 7px 0;
            }
    
            .showHideBtn {
                width: 7px;
                height: 7px;
                position: absolute;
                margin-top: 25px;
                margin-left: 218px;
            }
            .showHideBtn i{
                font-size: 14px;
            }
        }

        .bg-danger {
            display: flex;
            justify-content: center; /* Add this line */
            align-items: center; /* Add this line */
            background-color: #ff4961;
            color: white;
            text-align: center;
          }
          
          .bg-danger span {
            display: flex;
            justify-content: center; /* Add this line */
            align-items: center; /* Add this line */
            background-color: #ff4961;
            color: white;
            text-align: center !important;
          }
          
          #messageShower {
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            text-align: center; /* Add this line */
            padding: 5px;
          }
        
        .bg-success {
            background-color: #dff0d8;
            color: #3c763d;
        }
        
        .bg-info {
            background-color: #d9edf7;
            color: #31708f;
        }
        .container ul.errorlist li {
            color: red !important;
          }
          
    </style>
</head>
<!-- <body oncontextmenu="false"> -->

<body>
    {% if messages %}
    {% for message in messages %}
    <div id="messageShower" class="{% if 'error' in message.tags %}bg-danger{% elif 'success' in message.tags %}bg-success{% elif 'info' in message.tags %}bg-info{% endif %}">
    <span> {{ message }}</span>
    </div>
    {% endfor %}
    {% endif %}

    <div class="containerMain">
        
        <div class="container">
            
          <img src="{% static 'styles/img/logo13.png' %}" alt="">
    
  {% block content %} {% endblock %}

</div>
</div>
    
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      
        // message shower js code
        const message = document.getElementById('messageShower');
        if (message) {
          setTimeout(() => {
            message.style.display = 'none';
          }, 4000); //to increase or decrease delay time , change 2000. .(1 second = 1 * 1000 millisecond)
        }
      });
      
      
  </script>
</html>
